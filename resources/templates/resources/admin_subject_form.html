{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} — KnowledgeX{% endblock %}

{% block content %}
<div class="animate-in">
  <div class="glass-card p-4 mx-auto" style="max-width: 640px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-1"><i class="bi bi-pencil-square me-2"></i>{{ title }}</h3>
      <a href="{% url 'resources:admin_subject_list' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left-circle me-1"></i>Back</a>
    </div>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="form-error">{{ field.errors }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
