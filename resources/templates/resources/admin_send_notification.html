{% extends 'base.html' %}
{% load static %}

{% block title %}Send Notification — KnowledgeX{% endblock %}

{% block content %}
<div class="animate-in">
  <div class="glass-card p-4 mx-auto" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="mb-1"><i class="bi bi-bell me-2"></i>Notification Center</h3>
        <p class="text-muted mb-0">Send announcements to all active users.</p>
      </div>
      <a href="{% url 'resources:admin_analytics' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left-circle me-1"></i>Back to Analytics</a>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" class="form-control" placeholder="Semester Exams">
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message" class="form-control" rows="5" placeholder="Upload important notes before Friday."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send Notification</button>
    </form>
  </div>
</div>
{% endblock %}
