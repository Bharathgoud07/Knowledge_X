{% extends "base.html" %}

{% block title %}Password Reset Complete — KnowledgeX{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <h3>Password reset complete ✅</h3>
      <p class="text-muted-custom">
        Your password has been set. You can now log in with your new password.
      </p>
    </div>

    <a href="{% url 'accounts:login' %}" class="btn-primary-custom w-full" style="text-align:center;display:block;">
      Go to Login
    </a>
  </div>
</div>
{% endblock %}
